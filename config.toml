# Trusted operator policy. Paths are relative to THIS file, not your shell's cwd.
[agent]
workspace = "workspace"
prompt_file = "system_prompt.md"

[provider]
base_url = "https://openrouter.ai/api/v1"
model = "openrouter/free"
api_key_env = "OPENROUTER_API_KEY"
timeout_seconds = 60

[audit]
# Mandatory local record, outside the agent workspace. No API keys are collected.
directory = "runs"
# Each before/after snapshot is bounded; exceeding a limit stops the run.
max_snapshot_bytes = 10000000
max_log_bytes = 20000000

[limits]
max_turns = 20
max_tool_calls = 40
max_output_tokens = 2048
max_file_bytes = 100000
max_output_bytes = 16000
max_directory_entries = 200

[tools]
# Default deny: an omitted tool is neither advertised nor dispatched.
allow = ["get_files_info", "get_file_content", "write_file", "run_command"]
# Match paths, ancestors, or single components (case-insensitive Unicode globs).
# Commands refuse to mount a workspace containing any denied paths.
deny_paths = [".env", ".env.*", ".git", ".ssh", "*.pem", "*.key"]

[execution]
# native = Seatbelt on macOS; bubblewrap on Linux. No daemon, VM, or Node.js.
backend = "native"
# Extra trusted runtime paths, read-only. Never grant a home/project/root directory.
read_paths = []
# Only used by the optional Docker backend.
image = "ctf-agent:local"
network = "none"   # native: 'outbound'; docker: 'bridge'. Both opt into broad networking.
writable = false   # Commands see the workspace read-only. write_file still works.
timeout_seconds = 30
memory_mb = 256    # Docker: aggregate memory. Native Linux: per-process address space.
cpus = 1           # Docker only. Native uses per-process CPU time and a wall timeout.
pids = 64          # Docker only; native does not promise an aggregate process limit.

# Names map to trusted argv prefixes. No host shell is used.
# Extra model-supplied arguments are appended. Python can execute arbitrary code.
[execution.commands]
# Ignore Python environment/user-site settings while retaining local imports.
# Native 'python' selects the interpreter running this CLI, without PATH lookup.
# For Docker, use the absolute in-image path /usr/local/bin/python instead.
python = ["python", "-E", "-s", "-B"]
