[project]
name = "aiagent"
version = "0.1.0"
description = "A small, sandboxed AI agent for CTFs and authorized security labs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[project.scripts]
ctf-agent = "aiagent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiagent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
